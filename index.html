<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FolkMade - Handcrafted Traditions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toast" class="toast hidden"></div>

  <div class="top-strip">🏪 <span>Empowering 500+ Rural Artisans & Traditional Food Creators across India. Free shipping on orders over ₹999!</span></div>

  <header class="header">
    <div class="header-inner">
      <button class="brand" onclick="showView('shop')">
        <div class="brand-mark">FM</div>
        <div>
          <div class="brand-name">FolkMade</div>
          <div class="brand-tag">HANDCRAFTED TRADITIONS</div>
        </div>
      </button>

      <div class="search-wrap" id="desktopSearch">
        <input id="searchInput" type="text" placeholder="Search handmade pots, pickles, wooden decor, teas..." oninput="renderShop()">
        <span>⌕</span>
        <button onclick="clearSearch()" id="clearSearch">×</button>
      </div>

      <nav class="nav-actions">
        <button id="shopBtn" class="nav-btn active" onclick="showView('shop')">Shop Marketplace</button>
        <button class="icon-btn" title="Saved Wishlist" onclick="showView('wishlist')">♡<b id="wishCount"></b></button>
        <button class="icon-btn" title="Shopping Bag" onclick="openCart()">🛍<b id="cartCount"></b></button>
        <button id="adminBtn" class="admin-btn" onclick="toggleAdmin()">▣ <span id="adminText">Admin Portal</span></button>
      </nav>
    </div>
  </header>

  <main id="app"></main>

  <div id="modal" class="modal hidden" onclick="closeModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="hideModal()">×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <aside id="cartPanel" class="cart-panel">
    <div class="cart-head"><h2>Your Shopping Bag</h2><button onclick="closeCart()">×</button></div>
    <div id="cartItems" class="cart-items"></div>
    <div class="cart-footer">
      <div><span>Subtotal</span><strong id="cartSubtotal">₹0</strong></div>
      <div><span>Shipping</span><strong id="shipping">Free</strong></div>
      <div class="grand"><span>Total</span><strong id="grandTotal">₹0</strong></div>
      <button class="primary full" onclick="checkout()">Proceed to Checkout</button>
    </div>
  </aside>
  <div id="overlay" class="overlay hidden" onclick="closeCart()"></div>

  <script src="script.js"></script>
</body>
</html>
