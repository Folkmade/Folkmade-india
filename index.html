<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FolkMade — Online Shopping for Handcrafted Traditions</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="toast" class="top-strip hidden">Notification Message</div>

<header class="header">
  <div class="header-inner">
    <div class="brand" onclick="state.view='shop';render();">
      <div class="brand-mark"><img src="README.md" alt="FolkMade Logo"></div>
      <div>
        <div class="brand-name">FolkMade</div>
        <div class="brand-tag">Handcrafted Traditions</div>
      </div>
    </div>

    <div class="search-wrap">
      <input id="searchInput" placeholder="Search for hand pottery, wooden decor, artifacts..." oninput="renderShop()">
      <button class="search-btn">🔍</button>
    </div>

    <nav class="nav-actions">
      <button class="nav-item-btn" onclick="state.view='shop';render();">Store</button>
      <button class="nav-item-btn">♡ Wishlist <span id="wishCount" class="badge-count">0</span></button>
      <button class="nav-item-btn">🛍 Bag <span id="cartCount" class="badge-count">0</span></button>
      <button id="accountBtn" class="account-badge">👤 Login / Register</button>
    </nav>
  </div>
</header>

<main id="app"></main>

<!-- Unified Modal Container -->
<div id="modal" class="modal hidden">
  <div class="modal-card">
    <button class="modal-close" onclick="$('modal').classList.add('hidden')">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
