<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FolkMade — Handcrafted Traditions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="toast" class="toast hidden"></div>
<div class="top-strip">🛍️ Empowering 500+ Rural Artisans & Traditional Food Creators across India. Free shipping on orders over ₹999!</div>
<header class="header">
  <div class="header-inner">
    <div class="brand" onclick="showView('shop')">
     <div class="brand-container">
  <img src="https://raw.githubusercontent.com/Folkmade/Folkmade-india/b36ea9a33878b0346fcb70eea7df545f2355e8cb/IMG-20260904-WA0022.jpg" alt="FolkMade Logo" class="brand-logo">
  <div class="brand-text">
    <div class="brand-name">FolkMade</div>
    <div class="brand-tag">Handcrafted Traditions</div>
  </div>
</div>
    <div id="desktopSearch" class="search-wrap"><input id="searchInput" placeholder="Search handmade pots, pickles, wooden decor, teas..."><span>⌕</span><button onclick="clearSearch()">×</button></div>
    <nav class="nav-actions">
      <button id="shopBtn" class="nav-btn" onclick="showView('shop')">Shop Marketplace</button>
      <button class="icon-btn" onclick="showView('wishlist')" title="Saved Wishlist">♡<span id="wishCount" class="count"></span></button>
      <button class="icon-btn" onclick="openCart()" title="Shopping Bag">🛍<span id="cartCount" class="count"></span></button>
      <button id="accountBtn" class="account-btn" onclick="openAuth()">👤 Login / Register</button>
    </nav>
  </div>
</header>
<main id="app"></main>

<!-- Cart -->
<div id="overlay" class="overlay hidden" onclick="closeCart()"></div>
<aside id="cartPanel" class="cart-panel">
  <div class="cart-head"><h2>Shopping Bag</h2><button onclick="closeCart()">×</button></div>
  <div id="cartItems" class="cart-items"></div>
  <div class="cart-footer"><div><span>Subtotal</span><b id="cartSubtotal">₹0</b></div><div><span>Shipping</span><b id="shipping">Free</b></div><div class="grand"><span>Total</span><b id="grandTotal">₹0</b></div><button class="primary full" onclick="checkout()">Checkout</button></div>
</aside>

<!-- Product / Admin modal -->
<div id="modal" class="modal hidden" onclick="closeModal(event)"><div class="modal-card"><button class="modal-close" onclick="hideModal()">×</button><div id="modalContent"></div></div></div>

<!-- Login / Registration -->
<div id="authModal" class="modal hidden" onclick="closeAuth(event)">
  <div class="modal-card auth-box">
    <button class="modal-close" onclick="closeAuth()">×</button>
    <div id="authContent"></div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
